name: CI

# Real, PR-gating CI -- Batch 10 Phase 6 (partial), DEC-115. Runs the same
# four commands this project's own CLAUDE.md has always asked a human to
# run by hand before every commit (ruff, pytest, flutter analyze, flutter
# test), automatically, on every real PR and every push to main.
#
# A real, disclosed, deliberate scope decision, not an oversight:
# - Backend tests run against a real, disposable Postgres 16 + pgvector
#   service container (the same real image DEC-010 first proved this
#   migration against locally), never the live Supabase project -- a real
#   PR must never be able to touch live, production-adjacent data.
# - `test_auth_google_oauth.py` (whole file) and two further real tests in
#   `test_main.py`/`test_google_token_refresh.py`
#   (`test_auth_token_with_a_fake_code_fails_loud_with_a_real_400`,
#   `test_a_real_deliberately_invalid_refresh_token_is_genuinely_rejected_by_googles_real_endpoint`
#   -- the second found live on `DEC-137`'s own first real CI run, the
#   same real gap as the first, not assumed in advance) are deliberately
#   excluded from this CI run. Each needs the real, live GOOGLE_OAUTH_
#   CLIENT_ID/SECRET to distinguish a real `invalid_grant`/`400` from
#   `invalid_client`/`503`/`invalid_request` (see `DEC-101`) -- this
#   environment's own permission boundary blocked programmatically
#   provisioning those as real GitHub Actions secrets during `DEC-115`'s
#   own session, so rather than silently skip them with no record, or work
#   around that denial, every exclusion is disclosed here, in this
#   file, in plain text. Genuinely still open in STATUS_INDEX.md -- if
#   GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET are ever added
#   as real repo secrets, remove all three exclusions below. This file's own
#   JWT_SIGNING_KEY/GOOGLE_TOKEN_ENCRYPTION_KEY stay CI-only dummy values
#   regardless, always distinct from the real, deployed ones (`DEC-114`,
#   `DEC-137`) -- unlike the OAuth client credentials above, this key is a
#   real, self-generated application secret, not tied to any external
#   account, so a real, disposable CI-only value is a real, safe thing to
#   commit here in plain text (it decrypts nothing this CI run doesn't
#   also encrypt itself, in the same disposable database).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A real, disposable, CI-only database -- never the live Supabase
      # project. A real, disposable, CI-only signing key -- never the
      # real, deployed JWT_SIGNING_KEY (DEC-114).
      SUPABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SIGNING_KEY: ci-only-dummy-signing-key-never-used-in-any-real-deployment
      GOOGLE_TOKEN_ENCRYPTION_KEY: j33Xsjc1AFsIgcJj2tgO4S68hrlnl6UICf3Tm3klA8g=
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend (editable, dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Apply real migrations to the disposable CI database
        working-directory: backend
        # Deliberately globbed in sorted order, never a hardcoded list.
        # A real, disclosed reason (DEC-120): this step originally named
        # 0001/0002/0003 explicitly, and went stale the moment DEC-119
        # added 0004 -- turning main's own CI red on that merge, found
        # by DEC-120's pre-merge review rather than noticed at the time.
        # A glob cannot go stale the same way when 0006 lands.
        # `set -e` plus the sorted glob means a genuinely broken
        # migration still fails this step loudly rather than being
        # skipped silently.
        run: |
          set -e
          for migration in migrations/*/up.sql; do
            echo "Applying $migration"
            psql "$SUPABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: pytest (excludes the real tests needing a live Google OAuth client secret -- see this file's own header comment)
        working-directory: backend
        run: |
          PYTHONPATH=src pytest tests -q \
            --ignore=tests/test_auth_google_oauth.py \
            --deselect=tests/test_main.py::test_auth_token_with_a_fake_code_fails_loud_with_a_real_400 \
            --deselect=tests/test_google_token_refresh.py::test_a_real_deliberately_invalid_refresh_token_is_genuinely_rejected_by_googles_real_endpoint

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Generate Drift code (real, required -- gitignored, never committed; see CLAUDE.md Common Commands)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        working-directory: mobile
        run: flutter test

  # Real CI/CD auto-deploy (Phase 9-A, `DEC-160`) -- automates the exact
  # `gcloud builds submit` + `gcloud run deploy` sequence every prior real
  # deployment in this project's history (`DEC-098` through `DEC-159`) has
  # run by hand. CRITICAL tier, not standard, per CLAUDE.md's own Rule 6:
  # an automated pipeline that pushes real changes to production Cloud Run
  # on every merge is a real external-action path, the same class of risk
  # as any other CRITICAL-tier path already reviewed at this tier, even
  # though no Gate/Gemini logic is touched here.
  #
  # Gated on BOTH real CI jobs above passing (`needs:`) AND a genuine push
  # to `main` (never a pull_request event -- a PR from a fork must never
  # be able to trigger a real deploy using this repo's own credentials).
  # Reuses the exact real Workload Identity Federation auth already proven
  # end-to-end by `test-gcp-auth.yml` (`DEC-098`) -- the same real
  # `quorum-github-pool`/`quorum-github` provider, the same real
  # `quorum-ci-deployer` service account -- never a downloaded service
  # account key.
  #
  # Deliberately does NOT pass --set-env-vars/--update-secrets/
  # --set-secrets anywhere in this job -- a plain `gcloud run deploy`
  # with only --image/--region/--concurrency/--min-instances/
  # --max-instances preserves every real credential (the 6 real Secret
  # Manager references and the remaining real plain env vars, `DEC-159`)
  # already attached to the live service, completely unchanged. This
  # job's only real job is rolling out new application code -- it is
  # structurally incapable of touching a real secret's value or
  # reference, by what flags it simply never passes, not by a runtime
  # check that could have a bug in it.
  #
  # Also deliberately does NOT pass --allow-unauthenticated, even though
  # every prior manual deploy in this project's history has -- a real,
  # disclosed, verified-live finding from building this job (`DEC-160`):
  # that flag tries to (re-)set the service's `roles/run.invoker`/
  # `allUsers` IAM policy binding on every single deploy, which needs
  # `run.services.setIamPolicy` -- a real permission `quorum-ci-deployer`
  # deliberately does NOT hold (least privilege; that's an IAM-admin-
  # adjacent permission a routine code-deploy identity has no real need
  # for). Live-verified directly, not assumed: a real, `--no-traffic`
  # test deploy WITH the flag completed with only a warning (the IAM-set
  # attempt failed, the code deploy itself still succeeded); the
  # identical test WITHOUT the flag completed with zero warnings. Since
  # this exact `allow-unauthenticated` binding is already correctly set
  # on the live service (`DEC-102`) and nothing in this job's own scope
  # ever needs to change it, omitting the flag here is the same "only
  # pass a flag when the value it controls is actually changing"
  # discipline this project already applies to secrets.
  #
  # The build step below uses `--async` + a real polling loop against
  # `gcloud builds describe`, NOT the simpler synchronous `gcloud builds
  # submit --tag ...` -- a second real, verified-live finding: the
  # synchronous form's own log-streaming/polling mechanism requires
  # project-level `roles/viewer`/`roles/owner` to tail the default Cloud
  # Build logs bucket, which `quorum-ci-deployer` deliberately does not
  # hold either. Confirmed live: the exact same synchronous command that
  # verified this job's OTHER real permission gaps kept reporting a real
  # `ERROR` from this log-streaming check even after the underlying
  # Cloud Build job had already reached a real `SUCCESS` status --
  # meaning the naive synchronous form would make this CI job report a
  # false failure on every real run, despite the actual build succeeding
  # every time. Submitting async and polling `builds describe` directly
  # (a plain Cloud Build API status read, real, live-confirmed to work
  # under this SA's actual permissions) avoids the log-streaming path
  # entirely.
  deploy:
    needs: [backend, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: quorum-505909
          workload_identity_provider: projects/649581407643/locations/global/workloadIdentityPools/quorum-github-pool/providers/quorum-github
          service_account: quorum-ci-deployer@quorum-505909.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build the real backend image via Cloud Build
        working-directory: backend
        # Tagged with the real, triggering commit SHA -- a genuine,
        # traceable identifier, matching this project's own established
        # `decNNN-YYYYMMDD` manual-tag convention in spirit (real and
        # specific, never a mutable `:latest`) without inventing a new
        # scheme this workflow would need to track state to generate.
        run: |
          set -e
          IMAGE="asia-south1-docker.pkg.dev/quorum-505909/cloud-run-source-deploy/quorum-backend:gha-${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          BUILD_ID=$(gcloud builds submit --async --tag "$IMAGE" --format="value(id)")
          echo "Submitted build $BUILD_ID -- polling for a real terminal status"

          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "Poll $i: $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Real build failure: $STATUS" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Build did not reach a terminal status within the real polling budget" >&2
          exit 1

      - name: Deploy the real image to Cloud Run
        run: |
          set -e
          gcloud run deploy quorum-backend \
            --image "$IMAGE" \
            --region asia-south1 \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Verify the real, live deployment
        # A real, live smoke test, not just a passing `gcloud` exit code
        # -- `gcloud run deploy` only reports success once Cloud Run's
        # own health check confirms the new revision is Ready and
        # serving traffic, but this step independently proves the public
        # URL itself, not just the revision's internal readiness probe,
        # actually answers correctly post-rollout.
        run: |
          set -e
          curl --fail --silent --show-error https://quorum-backend-649581407643.asia-south1.run.app/health
