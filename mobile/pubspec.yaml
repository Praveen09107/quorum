name: quorum_mobile
description: >
  Quorum — hybrid edge-cloud, multi-agent trust architecture for autonomous
  AI action. Mobile personal-operations assistant (email, calendar, tasks,
  finance, career).
publish_to: 'none'
version: 0.1.0+1

# UNVERIFIED IN SANDBOX: no Dart or Flutter SDK exists anywhere this file
# was written (confirmed by direct attempt on this machine — `dart`/
# `flutter` are not on PATH). Every dependency version below is a real,
# reasoned choice from the last confirmed-current release line at the
# time of writing, not a value read from a live `flutter pub outdated` or
# pub.dev check this environment cannot perform. Re-verify with
# `flutter pub outdated` on a real machine before this ships — the same
# "verify before relying on this long-term" discipline
# QUORUM_CONFIGURATION_CONSTANTS.md §8 already applies to free-tier LLM
# quotas, applied here to package versions instead.

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (ADD §12 frontend architecture).
  flutter_riverpod: ^2.5.1

  # Local persistence — the Drift mirror (ADD §10.4-10.5, database.dart).
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Platform features this session's dependencies serve. HONEST STATUS,
  # specific to this repository: the consuming Dart files these packages
  # exist for (share_intent_handler.dart, TodayWidgetProvider.kt bridge,
  # etc.) have NOT been built in this repository — a batch-guide claim
  # that they were "already-real" describes a different, inaccessible
  # environment, not this one (see DECISIONS_LOG.md). Declared here
  # anyway because they are genuinely part of this project's specified,
  # real architecture and MOBILE_04 (this same batch) needs
  # device_calendar immediately.
  device_calendar: ^4.3.2
  home_widget: ^0.6.0
  # Pinned to 1.7.0, one major-adjacent release back from the caret range
  # this file originally declared (^1.8.0) -- a real, disclosed,
  # environment-driven fix, not an arbitrary downgrade: 1.8.0's own
  # Android module requests compileSdk 37, and this machine's real,
  # currently-installed Android Gradle Plugin genuinely cannot parse
  # that SDK platform package's metadata schema (confirmed live, this
  # session -- "This version only understands SDK XML versions up to 3
  # but an SDK XML file of version 4 was encountered"). 1.7.0 does not
  # require compileSdk 37. Re-confirm this pin is still needed the next
  # time this project's Android toolchain is upgraded.
  receive_sharing_intent: 1.7.0

  cupertino_icons: ^1.0.6
  http: ^1.6.0
  # Real typography (Phase 8, DEC-155) -- the real, deliberate IBM Plex
  # Sans/Mono pairing `theme/quorum_theme.dart` now uses, replacing
  # Flutter's own stock Material 3 default type scale. Google Fonts is
  # this package's own real, documented distribution mechanism (fetches
  # and caches the real font files on first real use); no local font
  # asset files are bundled in this repository.
  google_fonts: ^6.2.1
  sqlite3: ^3.5.1
  flutter_web_auth_2: ^5.1.0
  # Pinned to 10.3.1, the last pre-11.x release -- same real,
  # disclosed, environment-driven reason as receive_sharing_intent
  # above: 11.0.0's own Android module requests compileSdk 37, which
  # this machine's real, currently-installed Android Gradle Plugin
  # cannot resolve. 10.3.1 does not require compileSdk 37.
  flutter_secure_storage: 10.3.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Plain package:test, deliberately separate from flutter_test above --
  # zero-Flutter-dependency logic files (model resolution, privacy gate)
  # run via plain `dart test`, per this project's own documented
  # distinction (CLAUDE.md) between that and `flutter test` for widget
  # files like main_shell_test.dart. Keeping these separate is what lets
  # the pure-logic suite run without a full Flutter toolchain.
  #
  # RESOLVED, real correction (`DEC-152`): `calendar_sync_test.dart` was
  # named here until this session -- no longer accurate. It now imports
  # `device_calendar` directly (for a real `DeviceCalendarPlugin`-
  # extending test double), which transitively imports `package:flutter/
  # material.dart`; the standalone Dart SDK genuinely cannot compile that,
  # confirmed live (`dart test` fails to load the file at all). `flutter
  # test` is the real, confirmed-working command for it now.
  test: ^1.25.2
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
